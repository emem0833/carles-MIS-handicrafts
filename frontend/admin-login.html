<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Carles Handicraft System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a4a0a 0%, #2d6e15 50%, #1a4a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?w=1920') center/cover no-repeat;
            opacity: 0.15;
            pointer-events: none;
        }
        .login-container { width: 100%; max-width: 450px; margin: 20px; z-index: 1; }
        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, #2d5016, #1e3a0c);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header .icon { font-size: 3rem; margin-bottom: 15px; }
        .login-header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .login-header p { font-size: 0.85rem; opacity: 0.8; }
        .login-body { padding: 40px 30px; }
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        .input-group .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2d5016;
            font-size: 1.1rem;
            z-index: 2;
        }
        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #2d5016;
            font-size: 1.1rem;
            background: none;
            border: none;
            padding: 5px;
            z-index: 2;
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }
        .checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .forgot-link { color: #2d5016; text-decoration: none; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2d5016, #1e3a0c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(45, 80, 22, 0.3); }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            display: none;
        }
        .login-footer {
            text-align: center;
            padding: 20px 30px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 0.75rem;
            color: #6b7280;
        }
        .municipality-badge {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
        }
        @media (max-width: 480px) {
            .login-body { padding: 30px 20px; }
            .login-header { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon"><i class="fas fa-leaf"></i></div>
                <h1>Carles Handicraft System</h1>
                <p>Administrator Login</p>
                <div style="margin-top: 10px; font-size: 0.7rem;">
                    <i class="fas fa-map-marker-alt"></i> Municipality of Carles, Iloilo
                </div>
            </div>
            <div class="login-body">
                <div id="errorMsg" class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Invalid email or password</span>
                </div>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Email Address" autocomplete="off" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="login-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Log In
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> Secure Access | #CarlesdaBest
            </div>
        </div>
        <div class="municipality-badge">
            <i class="fas fa-landmark"></i> Official System | Tourism Officer Access
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5002/api';
        
        // Redirect if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'admin-dashboard.html';
        }

        // Show/Hide Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            
            // Reset error
            errorMsg.style.display = 'none';
            
            if (!email || !password) {
                errorText.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'flex';
                return;
            }
            
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            loginBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', data.user.email);
                    localStorage.setItem('adminRole', data.user.role);
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    }
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorText.textContent = data.error || 'Invalid credentials';
                    errorMsg.style.display = 'flex';
                }
            } catch (error) {
                errorText.textContent = 'Connection error. Make sure the server is running.';
                errorMsg.style.display = 'flex';
                console.error('Login error:', error);
            } finally {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                loginBtn.disabled = false;
            }
        });
        
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Please contact the System Administrator to reset your password.\n\nMunicipality of Carles IT Office\nEmail: lgucarlestourism@gmail.com');
        });
    </script>
</body>
</html>
